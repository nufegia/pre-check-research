<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7f8;
      --paper: #ffffff;
      --ink: #1d2329;
      --muted: #5f6b76;
      --line: #d9e0e6;
      --line-strong: #b9c5cf;
      --accent: #0f766e;
      --accent-soft: #e7f4f2;
      --warn: #9a5b00;
      --warn-soft: #fff4dd;
      --code: #f1f4f6;
      --shadow: 0 18px 50px rgba(25, 35, 45, 0.10);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.72;
      letter-spacing: 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page-shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }

    .report-header {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 34px 38px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .report-header h1 {
      margin: 0;
      max-width: 1000px;
      color: var(--ink);
      font-size: 30px;
      line-height: 1.28;
      font-weight: 760;
    }

    .report-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .meta-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
      background: #fbfcfd;
      min-width: 0;
    }

    .meta-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .meta-value {
      display: block;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .toc {
      position: sticky;
      top: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 18px 18px 16px;
      max-height: calc(100vh - 40px);
      overflow: auto;
    }

    .toc-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .toc ol {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc li + li {
      margin-top: 6px;
    }

    .toc a {
      display: block;
      border-left: 2px solid transparent;
      padding: 4px 0 4px 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .toc a:hover {
      border-left-color: var(--accent);
      color: var(--ink);
      text-decoration: none;
    }

    .toc .level-3 a {
      padding-left: 22px;
      font-size: 13px;
    }

    .report-card {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 34px 42px 44px;
    }

    .report-body h1 {
      display: none;
    }

    .report-body h2 {
      margin: 34px 0 14px;
      padding-top: 8px;
      color: var(--ink);
      font-size: 23px;
      line-height: 1.35;
      border-top: 1px solid var(--line);
    }

    .report-body h2:first-child {
      margin-top: 0;
      border-top: 0;
    }

    .report-body h3 {
      margin: 28px 0 12px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.4;
    }

    .report-body p {
      margin: 12px 0;
    }

    .report-body ul,
    .report-body ol {
      margin: 12px 0 16px;
      padding-left: 1.35em;
    }

    .report-body li + li {
      margin-top: 6px;
    }

    .report-body hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 26px 0;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 16px 0 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      font-size: 14px;
      line-height: 1.58;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    th {
      background: #eef3f5;
      color: #263039;
      font-weight: 700;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) td {
      background: #fbfcfd;
    }

    .evidence-card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 16px 0 24px;
    }

    .evidence-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      padding: 16px;
    }

    .evidence-card__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .evidence-card__meta span {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--paper);
      color: #33414c;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      padding: 5px 9px;
    }

    .evidence-card__title {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 760;
      line-height: 1.38;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    .evidence-card__location {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .evidence-card__id {
      margin: 0 0 12px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.5;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    .evidence-card__block {
      min-width: 0;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 10px 12px;
    }

    .evidence-card__block + .evidence-card__block {
      margin-top: 10px;
    }

    .evidence-card__block span {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 760;
    }

    .evidence-card__block p {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.62;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .evidence-card__action {
      background: var(--warn-soft);
      border-color: #efd59c;
    }

    .evidence-card__action span {
      color: var(--warn);
    }

    code {
      border-radius: 5px;
      background: var(--code);
      color: #23313b;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
      padding: 0.12em 0.35em;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    strong {
      font-weight: 760;
    }

    .validation-note {
      margin-top: 26px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent-soft);
      padding: 12px 14px;
      color: #23433f;
      font-size: 13px;
      line-height: 1.55;
    }

    @media (max-width: 980px) {
      .page-shell {
        padding: 18px 12px 36px;
      }

      .report-header {
        padding: 24px 20px;
      }

      .report-header h1 {
        font-size: 24px;
      }

      .report-meta {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .toc {
        position: static;
        max-height: none;
      }

      .report-card {
        padding: 24px 18px 32px;
      }

      .evidence-card-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        background: #ffffff;
        font-size: 12px;
      }

      .page-shell {
        max-width: none;
        padding: 0;
      }

      .report-header,
      .report-card,
      .toc {
        box-shadow: none;
        border-color: #cbd3da;
      }

      .layout {
        display: block;
      }

      .toc {
        display: none;
      }

      .report-header {
        margin-bottom: 14px;
        padding: 18px 20px;
      }

      .report-card {
        padding: 0 4px;
        border: 0;
      }

      .report-body h2 {
        break-after: avoid;
      }

      .table-wrap {
        overflow: visible;
        break-inside: avoid;
      }

      table {
        min-width: 0;
        font-size: 10px;
      }

      .evidence-card-grid {
        display: block;
      }

      .evidence-card {
        break-inside: avoid;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="report-header">
      <p class="eyebrow">PCR Research Data Risk Audit</p>
      <h1>{{TITLE}}</h1>
      <section class="report-meta" aria-label="交付报告信息">
        {{REPORT_META}}
      </section>
    </header>

    <div class="layout">
      <nav class="toc" aria-label="目录">
        <p class="toc-title">目录</p>
        {{TOC}}
      </nav>

      <article class="report-card">
        <div class="report-body">
          {{REPORT_BODY}}
        </div>
        <aside class="validation-note">
          本 HTML 为 Markdown 交付报告的样式化呈现版本；正文信息以源 Markdown 为准，转换过程不新增或删减复核结论。
        </aside>
      </article>
    </div>
  </main>
</body>
</html>
