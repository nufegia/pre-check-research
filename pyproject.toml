[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-check-research"
version = "1.1.0"
description = "Pre-check research data risk audit toolkit. CLI prefix and project abbreviation: pcr."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "PreCheckResearch contributors"}
]
keywords = ["research", "audit", "statistics", "reproducibility", "data-quality"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pdfplumber>=0.11",
  "scipy>=1.10",
]

[project.optional-dependencies]
image = [
  "Pillow>=10.0",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.22",
]
dev = ["pytest>=8.0"]

[project.scripts]
pcr-extract = "pcr_audit.cli:extract_main"
pcr-raw-audit = "pcr_audit.cli:raw_audit_main"
pcr-report = "pcr_audit.cli:report_main"
pcr-audit = "pcr_audit.cli:audit_main"
pcr-crosscheck = "pcr_audit.cli:crosscheck_main"

[project.urls]
Homepage = "https://github.com/PreCheckResearch/pre-check-research"
Repository = "https://github.com/PreCheckResearch/pre-check-research"
Issues = "https://github.com/PreCheckResearch/pre-check-research/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
